services:
  db:
    image: postgres:16-alpine
    container_name: plantpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plantpulse}
    ports:
      - "5433:5432"
    volumes:
      - plantpulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plantpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - plantpulse-net

  redis:
    image: redis:7-alpine
    container_name: plantpulse-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - plantpulse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - plantpulse-net

  api-service:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: plantpulse-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/plantpulse
      - REDIS_URL=redis://redis:6379/0
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - plantpulse-net

  web-app:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: plantpulse-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_SSE_URL=http://localhost:8001/api/v1/stream/telemetry
      - PORT=3000
    ports:
      - "3001:3000"
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - plantpulse-net

volumes:
  plantpulse_pg_data:
  plantpulse_redis_data:

networks:
  plantpulse-net:
    driver: bridge
